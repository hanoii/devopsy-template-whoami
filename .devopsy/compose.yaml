# traefik/whoami behind devopsy-template-traefik: answers with the request it got,
# headers included, which makes routing, TLS and client IPs easy to check.
services:
  # Floats on v1.12: every release pulls its patches. Never latest.
  web:
    image: traefik/whoami:v1.12
    restart: unless-stopped
    # Hardening checklist, for this service and the ones you add:
    # - a fixed non-root UID, not the deploy user (1000, in the docker group:
    #   an escape would land as root-equivalent): 10001, shared by all
    #   projects;
    # - a read-only root filesystem, with tmpfs or a mnt entry for what must
    #   be written;
    # - cap_drop ALL, adding back only a capability a stated reason needs
    #   (none here: Docker lets any process bind port 80);
    # - no-new-privileges, so nothing gains privilege through setuid files;
    # - in images you build, no setuid binaries and no file capabilities
    #   the service does not need.
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      # Each release gets the server's base domain from its proxy
      # (devopsy-template-traefik exports it), for <project>-<environment>.<domain>. Without a
      # proxy running the release fails: the project expects one.
      - devopsy.import.PROXY_BASE_DOMAIN=proxy/BASE_DOMAIN
      - traefik.enable=true
      # SITE_HOST_RULE: the target's PROXY_DOMAINS plus
      # <compose project>.<PROXY_BASE_DOMAIN>, computed by
      # capabilities/env/compute. The fallback, for plain docker compose, is
      # a HostRegexp: Traefik requests no certificate for it, so a target
      # without hosts logs no ACME errors.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.rule=${SITE_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      # The certificate resolver: the server's default (the proxy's own
      # PROXY_CERTRESOLVER, le-http01 unless set), or the target's
      # PROXY_CERTRESOLVER (le-http01, le-dns01-selfhosted or
      # le-dns01-cloudflare). Unset, there is no label at all (compose
      # leaves an empty one): an empty resolver gets no certificate.
      - ${PROXY_CERTRESOLVER:+traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.tls.certresolver=$PROXY_CERTRESOLVER}
      # HTTP basic auth while SITE_BASIC_AUTH (user:password) is set,
      # hashed by capabilities/env/compute. Unset, both are empty: no
      # middleware on the router, and Traefik skips one without users.
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-app}.middlewares=${SITE_MIDDLEWARES:-}
      - traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-app}-auth.basicauth.users=${SITE_BASIC_AUTH_USERS:-}
    networks: [default, traefik]

networks:
  traefik:
    name: traefik
    external: true
